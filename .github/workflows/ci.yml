name: verify

on:
  push:
    branches: [main]
    tags: ['ch*', 'm*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # The same gate scripts/finish-chapter.sh runs locally: formatting, the
      # answer key and the milestones green, and the exercises still compiling.
      #
      # sbt's `[error]` lines are re-emitted as annotations, so a red gate says
      # why on the pull request itself, without opening the log.
      - name: sbt verify
        shell: bash
        run: |
          set -o pipefail
          sbt -batch verify 2>&1 | tee sbt.log || {
            # Escape sequences out first: sbt's thin client paints inside the
            # brackets (`[<esc>[31merror`) and clears lines with `<esc>[0J`.
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' sbt.log > sbt.plain.log
            # A compiler diagnostic spans several lines and only some carry the
            # [error] prefix, so the report is the stretch of log that starts
            # a little before the first error — joined into one annotation,
            # since GitHub shows at most ten per step.
            first="$(grep -n -F '[error]' sbt.plain.log | head -n 1 | cut -d: -f1)"
            from=$(( ${first:-$(wc -l < sbt.plain.log)} - 25 ))
            report="$(tail -n +"$(( from > 1 ? from : 1 ))" sbt.plain.log | head -n 60)"
            report="${report//'%'/'%25'}"
            echo "::error title=sbt verify::${report//$'\n'/'%0A'}"
            exit 1
          }

  practice:
    name: exercises (informational)
    runs-on: ubuntu-latest
    # Unsolved exercises are supposed to fail here. The job runs so the count is
    # visible on every commit; it is not allowed to fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: sbt practice
        run: sbt -batch practice
