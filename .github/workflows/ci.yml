name: verify

on:
  push:
    branches: [main]
    tags: ['ch*', 'm*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # The same gate scripts/finish-chapter.sh runs locally: formatting, the
      # answer key green, and the exercises still compiling.
      - name: sbt verify
        run: sbt -batch verify

  practice:
    name: exercises (informational)
    runs-on: ubuntu-latest
    # Unsolved exercises are supposed to fail here. The job runs so the count is
    # visible on every commit; it is not allowed to fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: sbt practice
        run: sbt -batch practice
